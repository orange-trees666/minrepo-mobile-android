name: Build Android Debug APK

on:
  push:
    branches: [main]
    paths:
      - "MinRepoMobile/**"
      - ".github/workflows/android-debug-apk.yml"
      - ".github/scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - "MinRepoMobile/**"
      - ".github/workflows/android-debug-apk.yml"
      - ".github/scripts/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  prune-old-artifacts:
    runs-on: ubuntu-latest
    steps:
      # 容量上限に達している場合でも、新しいビルドより先に古いDebug APKを整理します。
      # PRでは削除処理を行わず、main実行時だけ既存の最新版1件を残します。
      - name: Keep newest stored debug APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          script: |
            const artifactName = 'minrepo-mobile-debug-apk';
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const managed = artifacts
              .filter(a => a.name === artifactName && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            let deleted = 0;
            for (const artifact of managed.slice(1)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              deleted++;
            }

            core.info(`Deleted ${deleted} older debug APK artifacts before build.`);

  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup Node for browser collector checks
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify browser collector and archive format
        run: |
          npm ci --prefix tests/collector --ignore-scripts --no-audit --no-fund
          node tests/collector/test.cjs
          git diff --exit-code tests/fixtures/collector-output.json
      # 実コードを検証し、外部通信やAndroid SDKに依存せず早期に異常を検出します。
      - name: Run offline regression checks
        run: dotnet run --project tests/MinRepoMobile.Regression/MinRepoMobile.Regression.csproj -c Release

  build:
    needs: [prune-old-artifacts, regression]
    # KVM対応Linux上で、署名APKを実Androidのブラウザーまで通して検証します。
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Select Android Java
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore MinRepoMobile/MinRepoMobile.csproj

      # Debug APKはテスト導入用です。一般配布時は独自の署名鍵でRelease発行してください。
      - name: Build debug APK
        run: dotnet build MinRepoMobile/MinRepoMobile.csproj -f net10.0-android -c Debug

      # JS/Cookie模擬取得・Chrome取得ファイル取込・実HTML形式のAndroid検証を配布条件にします。
      # 外部サイトの直接取得は別の成否として明記し、失敗を成功と扱いません。
      - name: Verify Android browser and Chrome file import
        run: bash .github/scripts/android-browser-smoke.sh

      # ライブ取得の失敗も含め、必須チェックの成否と別々に診断結果を保存します。
      - name: Upload browser test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/minrepo-browser-test/result.json
            ${{ runner.temp }}/minrepo-browser-test/browser.log
            ${{ runner.temp }}/minrepo-browser-test/browser-final.html
            ${{ runner.temp }}/minrepo-browser-test/failure.png
          if-no-files-found: ignore
          retention-days: 2

      # PRではビルド確認だけを行い、容量を消費するAPKは保存しません。
      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: minrepo-mobile-debug-apk
          # 端末へ単体でインストールできる署名済みAPKだけを保存します。
          path: MinRepoMobile/bin/Debug/net10.0-android/**/*-Signed.apk
          if-no-files-found: error
          retention-days: 7

  cleanup-artifacts:
    # ビルドやアップロードが失敗しても実行し、利用可能な最新版1件だけを残します。
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Delete older debug APK artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const artifactName = 'minrepo-mobile-debug-apk';
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const managed = artifacts
              .filter(a => a.name === artifactName && !a.expired)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            let deleted = 0;
            for (const artifact of managed.slice(1)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              deleted++;
            }

            core.info(`Deleted ${deleted} older debug APK artifacts after build.`);
